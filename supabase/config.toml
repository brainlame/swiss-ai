project_id = "ai-constitutions"
[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
port = 54323
[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://localhost:5173/auth/callback?**", "http://localhost:5173/auth/confirm", "http://127.0.0.1:5173/auth/callback", "http://127.0.0.1:5173/auth/callback?**", "http://127.0.0.1:5173/auth/confirm"]
[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "1m"
[auth.email.template.magic_link]
subject = "Your AI Constitutions sign-in code"
content_path = "./supabase/templates/email-code.html"
[auth.email.template.confirmation]
subject = "Your AI Constitutions verification code"
content_path = "./supabase/templates/email-code.html"
[auth.hook.password_verification_attempt]
enabled = true
uri = "pg-functions://postgres/public/reject_password_login"
[storage]
file_size_limit = "10MiB"
